name: Apply storefront refinement

on:
  push:
    branches:
      - storefront-refinement-20260915
    paths:
      - '.github/workflows/apply-storefront-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild refinement payload
        shell: bash
        run: |
          cat .github/refinement/chunk-* > /tmp/storefront-remaining.b64
          base64 -d /tmp/storefront-remaining.b64 > /tmp/storefront-remaining.tar.gz
          echo "aec2bd7876de0157fb7eff50667badfb25d96d2fe914d904e197ca4424eec842  /tmp/storefront-remaining.tar.gz" | sha256sum -c -
          tar -xzf /tmp/storefront-remaining.tar.gz -C .
      - name: Commit verified storefront files
        shell: bash
        run: |
          rm -rf .github/refinement
          rm -f .github/workflows/apply-storefront-refinement.yml
          git config user.name "housefinds-refinement"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete storefront refinement"
          git push origin HEAD:storefront-refinement-20260915
